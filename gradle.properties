# Project-wide Gradle settings.
# Mémoire allouée au démon Gradle.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Obligatoire : utiliser les bibliothèques AndroidX (androidx.*) à la place des anciennes Support Libraries.
android.useAndroidX=true

# Chaque module ne génère que sa propre classe R (temps de build plus courts).
android.nonTransitiveRClass=true
